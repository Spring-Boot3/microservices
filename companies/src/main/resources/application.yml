spring:
  application:
    name: companies
  datasource:
    url: jdbc:postgresql://localhost:5434/companies
    username: romLab
    password: udemy
    hikari:
      maximum-pool-size: '5'
      connection-timeout: '20000'

logging:
  level:
    org:
      springframework:
        web: INFO
      hibernate:
        SQL: INFO
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    root: INFO

server:
  servlet:
    context-path: /api/companies/
  port: 0

eureka:
  instance:
    instance-id: "${spring.application.name}:${random.value}"
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
